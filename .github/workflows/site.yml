name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: HTML and accessibility checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Shared header and footer are up to date
        run: npm run check:includes
      - name: Counted buttons are listed, and no third-party scripts
        run: npm run check:tracking
      - name: Calendar files are valid and match their event pages
        run: npm run check:calendar
      - run: npm install --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      # Lighthouse runs first so the HTML, axe and zoom checks below also
      # cover report.html with the new scores filled in
      - name: Lighthouse (3 runs of 10 pages, phone settings)
        run: npx lhci collect
      - name: Save the Lighthouse results
        run: npx lhci upload --target=filesystem --outputDir=lighthouse-results
      - name: Fill in the performance report
        run: node scripts/performance-report.mjs --results lighthouse-results
      - name: Validate HTML
        run: npm run lint:html
      - name: Accessibility (axe-core, WCAG 2.2 AA, desktop and phone)
        run: |
          set -o pipefail
          if ! npm run test:a11y 2>&1 | tee a11y.log; then
            # Surface the last lines as annotations so they show on the run page
            tail -n 25 a11y.log | grep -v '^::' | sed 's/^/::error::/'
            exit 1
          fi
      - name: Zoom and text spacing (200% and 400% zoom, WCAG 1.4.12 spacing)
        run: npm run test:zoom
      - name: Program pages print on one sheet (US letter and A4)
        run: npm run test:print
      # Saves each graphic as a PNG in the web fonts, and fails if any text
      # doesn't fit or sits where the apps cover a story
      - name: Social media graphics fit and export (1080 x 1080 and 1080 x 1920)
        run: npm run social
      - name: Lighthouse budgets (performance, accessibility, SEO)
        run: npx lhci assert
      - name: Keep the filled-in report for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: report.html
      - name: Keep the social media graphics for the deploy
        uses: actions/upload-artifact@v4
        with:
          name: social-graphics
          path: demo/social
          if-no-files-found: error
      - name: Keep the full Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results
          if-no-files-found: ignore

  deploy:
    name: Publish to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html styleguide.html report.html analytics.html .nojekyll assets demo _site/
      # The check job filled in report.html with this version's Lighthouse scores
      - name: Get the filled-in performance report
        uses: actions/download-artifact@v4
        with:
          name: performance-report
          path: _performance
      - run: cp _performance/report.html _site/report.html
      # The PNG files the social media graphics page links to
      - name: Get the social media graphics
        uses: actions/download-artifact@v4
        with:
          name: social-graphics
          path: _site/demo/social
      # GitHub Pages shows /404.html for every missing address, so copy the
      # demo's "page not found" page there with links that work from any folder
      - name: Add the site-wide "page not found" page
        run: node scripts/site-404.mjs --base "${{ steps.pages.outputs.base_path }}" --out _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
